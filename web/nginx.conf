server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the SPA, the embeddable widget, and the demo page
    # all call /api/... on this origin, so there is no CORS to configure
    # anywhere. The /api/ prefix is preserved (no trailing slash on
    # proxy_pass), which is what the API routes — including the Stripe
    # webhook at /api/billing/webhook — expect.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real static files, never the SPA shell: the demo host page must be
    # served as itself so it can load the widget like a customer's site.
    location = /demo.html {
        try_files $uri =404;
    }

    # The embeddable widget script is a real file too — a customer site
    # loads it from /widget/supportpilot-widget.js.
    location /widget/ {
        try_files $uri =404;
        types {
            application/javascript js;
        }
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA fallback: every other unknown path returns the app shell so
    # client-side routes (dashboard, login, ...) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
